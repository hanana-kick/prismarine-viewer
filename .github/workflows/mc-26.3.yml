name: Minecraft Java 26.3 GitHub distribution

on:
  push:
    branches: [mc-26.3]
    paths-ignore:
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source dependencies
        run: npm install
      - name: Generate Minecraft Java 26.3 distributable
        run: npm run build
        env:
          PRISMARINE_VIEWER_TARGET_VERSIONS: '26.3'
      - name: Validate Minecraft Java 26.3
        run: npm run verify:mc26
      - name: Verify Minecraft 26.3 entity textures, meshes and socket initialization
        run: npm run verify:entities
      - name: Verify real browser avatar and entity rendering
        run: npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc26.3-browser-screenshot
          path: test/26.3-browser.png
          if-no-files-found: ignore
      - name: Check code style
        run: npm run lint
      - name: Check package contents
        run: npm pack --dry-run
      - name: Commit prebuilt GitHub distribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/index.js public/worker.js public/worldBounds.json
          git add -f public/textures/26.3.png public/textures/26.3
          git add -f public/blocksStates/26.3.json
          git add -f viewer/lib/biome-tints-26.3.json
          git add -f viewer/lib/entity/texture-map-26.3.json
          if ! git diff --cached --quiet; then
            git commit -m "build(mc26.3): include prebuilt pnpm GitHub assets [skip ci]"
            git push origin HEAD:mc-26.3
          fi
